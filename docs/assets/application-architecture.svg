<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Vidsearch application architecture</title>
  <desc id="desc">Two flows show video ingestion and indexing, plus query planning and retrieval, with adapter components shown alongside the core flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L8 4.5L1 8" fill="none" stroke="#496582" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #182b45; }
      .canvas { fill: #f5f8fc; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
      .subtitle { font-size: 15px; fill: #63748a; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1.3px; fill: #52667e; }
      .lane { fill: #edf2f8; stroke: #d8e1ec; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #c9d5e3; stroke-width: 1.5; }
      .card-blue { fill: #eaf3ff; stroke: #77a6e0; stroke-width: 1.7; }
      .card-teal { fill: #e8f7f5; stroke: #70b9ad; stroke-width: 1.7; }
      .card-amber { fill: #fff6e6; stroke: #dfb55c; stroke-width: 1.7; }
      .card-muted { fill: #ffffff; stroke: #c9d5e3; stroke-width: 1.5; }
      .card-title { font-size: 16px; font-weight: 650; }
      .card-copy { font-size: 12.5px; fill: #5f7085; }
      .small { font-size: 11px; fill: #6c7d91; }
      .pill { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; }
      .edge { fill: none; stroke: #496582; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { font-size: 11px; fill: #64778e; }
      .rule { stroke: #dce4ee; stroke-width: 1.5; }
    </style>
  </defs>
  <rect class="canvas" width="1600" height="1050" rx="22"/>

  <text class="title" x="56" y="65">Vidsearch</text>
  <text class="subtitle" x="56" y="94">Application architecture · ingestion, indexing, and retrieval</text>

  <text class="section" x="56" y="153">01 · INGESTION AND INDEXING</text>
  <rect class="lane" x="40" y="174" width="1520" height="202" rx="18"/>

  <path class="edge" d="M246 269H293"/>
  <path class="edge" d="M496 269H543"/>
  <path class="edge" d="M746 269H793"/>
  <path class="edge" d="M996 269H1043"/>
  <path class="edge" d="M1246 269H1293"/>

  <g>
    <rect class="card" x="56" y="216" width="190" height="106" rx="13"/>
    <circle cx="79" cy="242" r="12" fill="#dceaff"/>
    <text class="pill" x="75" y="246" fill="#3569a8">01</text>
    <text class="card-title" x="74" y="276">Video source</text>
    <text class="card-copy" x="74" y="299">Local media input</text>
  </g>
  <g>
    <rect class="card-muted" x="306" y="216" width="190" height="106" rx="13"/>
    <circle cx="329" cy="242" r="12" fill="#e7edf4"/>
    <text class="pill" x="325" y="246" fill="#64748b">02</text>
    <text class="card-title" x="324" y="276">API surface</text>
    <text class="card-copy" x="324" y="299">Factory and route modules</text>
  </g>
  <g>
    <rect class="card-blue" x="556" y="216" width="190" height="106" rx="13"/>
    <circle cx="579" cy="242" r="12" fill="#d6e8ff"/>
    <text class="pill" x="575" y="246" fill="#3569a8">03</text>
    <text class="card-title" x="574" y="276">Load and probe</text>
    <text class="card-copy" x="574" y="299">Path checks · ffprobe</text>
  </g>
  <g>
    <rect class="card-blue" x="806" y="216" width="190" height="106" rx="13"/>
    <circle cx="829" cy="242" r="12" fill="#d6e8ff"/>
    <text class="pill" x="825" y="246" fill="#3569a8">04</text>
    <text class="card-title" x="824" y="276">Segment video</text>
    <text class="card-copy" x="824" y="299">Fixed time windows</text>
  </g>
  <g>
    <rect class="card-teal" x="1056" y="216" width="190" height="106" rx="13"/>
    <circle cx="1079" cy="242" r="12" fill="#d5f0eb"/>
    <text class="pill" x="1075" y="246" fill="#26786f">05</text>
    <text class="card-title" x="1074" y="276">Extract evidence</text>
    <text class="card-copy" x="1074" y="299">Plugin interface</text>
  </g>
  <g>
    <rect class="card-teal" x="1306" y="216" width="190" height="106" rx="13"/>
    <circle cx="1329" cy="242" r="12" fill="#d5f0eb"/>
    <text class="pill" x="1325" y="246" fill="#26786f">06</text>
    <text class="card-title" x="1324" y="276">Index evidence</text>
    <text class="card-copy" x="1324" y="299">Pipeline orchestration</text>
  </g>

  <text class="section" x="56" y="424">OPTIONAL MODEL ADAPTERS</text>
  <rect x="40" y="442" width="735" height="132" rx="16" fill="#f2f8f7" stroke="#c9e4df" stroke-width="1.5"/>
  <text class="small" x="62" y="470">Optional streams add visual, speech, and scene-level evidence.</text>
  <rect class="card-muted" x="62" y="486" width="205" height="65" rx="11"/>
  <text class="card-title" x="80" y="513">Visual embeddings</text>
  <text class="card-copy" x="80" y="535">CLIP or SigLIP</text>
  <rect class="card-muted" x="294" y="486" width="205" height="65" rx="11"/>
  <text class="card-title" x="312" y="513">Speech and audio</text>
  <text class="card-copy" x="312" y="535">Transcripts · audio events</text>
  <rect class="card-muted" x="526" y="486" width="225" height="65" rx="11"/>
  <text class="card-title" x="544" y="513">Caption, detection, OCR</text>
  <text class="card-copy" x="544" y="535">Optional evidence streams</text>

  <text class="section" x="825" y="424">STORAGE ADAPTERS</text>
  <rect x="805" y="442" width="755" height="132" rx="16" fill="#f7f5fc" stroke="#ddd6ef" stroke-width="1.5"/>
  <text class="small" x="827" y="470">Evidence can be searched by text, vectors, and metadata.</text>
  <rect class="card-amber" x="827" y="486" width="210" height="65" rx="11"/>
  <text class="card-title" x="845" y="513">In-memory BM25</text>
  <text class="card-copy" x="845" y="535">Working text baseline</text>
  <rect class="card-muted" x="1065" y="486" width="210" height="65" rx="11"/>
  <text class="card-title" x="1083" y="513">Qdrant</text>
  <text class="card-copy" x="1083" y="535">Vector search storage</text>
  <rect class="card-muted" x="1303" y="486" width="235" height="65" rx="11"/>
  <text class="card-title" x="1321" y="513">SQLAlchemy metadata</text>
  <text class="card-copy" x="1321" y="535">Structured video metadata</text>

  <text class="section" x="56" y="660">02 · QUERY AND RETRIEVAL</text>
  <rect class="lane" x="40" y="680" width="1520" height="204" rx="18"/>
  <path class="edge" d="M246 778H293"/>
  <path class="edge" d="M496 778H543"/>
  <path class="edge" d="M746 778H793"/>
  <path class="edge" d="M996 778H1043"/>
  <path class="edge" d="M1246 778H1293"/>

  <g>
    <rect class="card" x="56" y="725" width="190" height="106" rx="13"/>
    <text class="card-title" x="74" y="766">Search query</text>
    <text class="card-copy" x="74" y="790">Natural language input</text>
  </g>
  <g>
    <rect class="card-muted" x="306" y="725" width="190" height="106" rx="13"/>
    <text class="card-title" x="324" y="766">Query planner</text>
    <text class="card-copy" x="324" y="790">LLM planning interface</text>
  </g>
  <g>
    <rect class="card-blue" x="556" y="725" width="190" height="106" rx="13"/>
    <text class="card-title" x="574" y="766">Search engine</text>
    <text class="card-copy" x="574" y="790">Configured retrievers</text>
  </g>
  <g>
    <rect class="card-blue" x="806" y="725" width="190" height="106" rx="13"/>
    <text class="card-title" x="824" y="766">Rank fusion</text>
    <text class="card-copy" x="824" y="790">Reciprocal-rank fusion</text>
  </g>
  <g>
    <rect class="card-muted" x="1056" y="725" width="190" height="106" rx="13"/>
    <text class="card-title" x="1074" y="766">Temporal grouping</text>
    <text class="card-copy" x="1074" y="790">Temporal result helpers</text>
  </g>
  <g>
    <rect class="card-teal" x="1306" y="725" width="190" height="106" rx="13"/>
    <text class="card-title" x="1324" y="766">Search results</text>
    <text class="card-copy" x="1324" y="790">Ranked time ranges</text>
  </g>

  <text class="small" x="56" y="932">Arrows show the primary processing flow. Model and storage cards show the supporting capabilities.</text>
  <text class="small" x="56" y="957">API routes and service adapters are defined separately from the processing flow.</text>
</svg>
