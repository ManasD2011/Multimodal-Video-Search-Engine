<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Vidsearch component relationships</title>
  <desc id="desc">Component groups for API, ingestion, evidence processing, retrieval, and storage, with direct relationships shown using clean solid arrows.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1L8 4.5L1 8" fill="none" stroke="#496582" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #182b45; }
      .canvas { fill: #f5f8fc; }
      .title { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
      .subtitle { font-size: 14px; fill: #63748a; }
      .lane-title { font-size: 13px; font-weight: 700; letter-spacing: 0.7px; }
      .lane-subtitle { font-size: 11px; fill: #6c7d91; }
      .lane { stroke-width: 1.5; }
      .api-lane { fill: #eef4fc; stroke: #d5e1f0; }
      .ingest-lane { fill: #eff5ff; stroke: #d5e2f5; }
      .evidence-lane { fill: #eef8f6; stroke: #d0e8e3; }
      .retrieval-lane { fill: #f3f1fb; stroke: #e0daf2; }
      .storage-lane { fill: #fbf6ed; stroke: #eee1c7; }
      .card { fill: #ffffff; stroke: #c9d5e3; stroke-width: 1.5; }
      .card-defined { fill: #eaf3ff; stroke: #77a6e0; stroke-width: 1.7; }
      .card-plugin { fill: #e8f7f5; stroke: #70b9ad; stroke-width: 1.7; }
      .card-neutral { fill: #ffffff; stroke: #c9d5e3; stroke-width: 1.5; }
      .card-title { font-size: 14px; font-weight: 650; }
      .card-copy { font-size: 11px; fill: #5f7085; }
      .edge { fill: none; stroke: #496582; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .edge-label { font-size: 10px; fill: #64778e; }
      .small { font-size: 11px; fill: #6c7d91; }
    </style>
  </defs>
  <rect class="canvas" width="1600" height="1040" rx="22"/>
  <text class="title" x="48" y="62">Component relationships</text>
  <text class="subtitle" x="48" y="89">How the Python packages and processing helpers fit together</text>

  <rect class="lane api-lane" x="36" y="130" width="284" height="800" rx="18"/>
  <rect class="lane ingest-lane" x="348" y="130" width="284" height="800" rx="18"/>
  <rect class="lane evidence-lane" x="660" y="130" width="284" height="800" rx="18"/>
  <rect class="lane retrieval-lane" x="972" y="130" width="284" height="800" rx="18"/>
  <rect class="lane storage-lane" x="1284" y="130" width="280" height="800" rx="18"/>

  <text class="lane-title" x="58" y="166">API</text>
  <text class="lane-subtitle" x="58" y="186">FastAPI entry points</text>
  <text class="lane-title" x="370" y="166">INGESTION</text>
  <text class="lane-subtitle" x="370" y="186">Local media utilities</text>
  <text class="lane-title" x="682" y="166">EVIDENCE</text>
  <text class="lane-subtitle" x="682" y="186">Plugin and indexing contracts</text>
  <text class="lane-title" x="994" y="166">RETRIEVAL</text>
  <text class="lane-subtitle" x="994" y="186">Planning and ranking helpers</text>
  <text class="lane-title" x="1306" y="166">STORAGE</text>
  <text class="lane-subtitle" x="1306" y="186">Text baseline and adapters</text>

  <path class="edge" d="M178 338V405"/>
  <path class="edge" d="M490 337V405"/>
  <path class="edge" d="M490 502V570"/>
  <path class="edge" d="M800 338V405"/>
  <path class="edge" d="M800 502V570"/>
  <path class="edge" d="M1114 502V570"/>

  <g>
    <rect class="card" x="64" y="260" width="228" height="78" rx="12"/>
    <text class="card-title" x="82" y="289">FastAPI app factory</text>
    <text class="card-copy" x="82" y="312">Creates app and includes routers</text>
  </g>
  <g>
    <rect class="card-neutral" x="64" y="405" width="228" height="78" rx="12"/>
    <text class="card-title" x="82" y="434">Route modules</text>
    <text class="card-copy" x="82" y="457">Ingest, search, video, and jobs</text>
  </g>
  <g>
    <rect class="card-neutral" x="64" y="570" width="228" height="78" rx="12"/>
    <text class="card-title" x="82" y="599">Auth and DB hooks</text>
    <text class="card-copy" x="82" y="622">Identity and persistence</text>
  </g>

  <g>
    <rect class="card-defined" x="376" y="240" width="228" height="78" rx="12"/>
    <text class="card-title" x="394" y="269">Local media loader</text>
    <text class="card-copy" x="394" y="292">Path checks and file discovery</text>
  </g>
  <g>
    <rect class="card-defined" x="376" y="405" width="228" height="78" rx="12"/>
    <text class="card-title" x="394" y="434">Media probe</text>
    <text class="card-copy" x="394" y="457">ffprobe metadata and limits</text>
  </g>
  <g>
    <rect class="card-defined" x="376" y="570" width="228" height="78" rx="12"/>
    <text class="card-title" x="394" y="599">Fixed-window segmenter</text>
    <text class="card-copy" x="394" y="622">Creates time-bounded segments</text>
  </g>

  <g>
    <rect class="card-defined" x="688" y="240" width="228" height="78" rx="12"/>
    <text class="card-title" x="706" y="269">Extractor registry</text>
    <text class="card-copy" x="706" y="292">Registers named plugins</text>
  </g>
  <g>
    <rect class="card-plugin" x="688" y="405" width="228" height="78" rx="12"/>
    <text class="card-title" x="706" y="434">Extractor plugins</text>
    <text class="card-copy" x="706" y="457">Interfaces for model adapters</text>
  </g>
  <g>
    <rect class="card-defined" x="688" y="570" width="228" height="96" rx="12"/>
    <text class="card-title" x="706" y="599">Indexing pipeline</text>
    <text class="card-copy" x="706" y="622">Runs plugins; forwards evidence</text>
    <text class="card-copy" x="706" y="642">to storage contracts</text>
  </g>

  <g>
    <rect class="card-neutral" x="1000" y="240" width="228" height="78" rx="12"/>
    <text class="card-title" x="1018" y="269">Query planner</text>
    <text class="card-copy" x="1018" y="292">Intent and modality selection</text>
  </g>
  <g>
    <rect class="card-defined" x="1000" y="405" width="228" height="78" rx="12"/>
    <text class="card-title" x="1018" y="434">Search engine</text>
    <text class="card-copy" x="1018" y="457">Calls configured retrievers</text>
  </g>
  <g>
    <rect class="card-defined" x="1000" y="570" width="228" height="78" rx="12"/>
    <text class="card-title" x="1018" y="599">Rank fusion</text>
    <text class="card-copy" x="1018" y="622">Reciprocal-rank fusion</text>
  </g>
  <g>
    <rect class="card-neutral" x="1000" y="750" width="228" height="78" rx="12"/>
    <text class="card-title" x="1018" y="779">Temporal helpers</text>
    <text class="card-copy" x="1018" y="802">Merge adjacent match windows</text>
  </g>

  <g>
    <rect class="card-defined" x="1300" y="405" width="228" height="90" rx="12"/>
    <text class="card-title" x="1318" y="435">In-memory BM25</text>
    <text class="card-copy" x="1318" y="458">Text search baseline</text>
    <text class="card-copy" x="1318" y="477">In-memory index</text>
  </g>
  <g>
    <rect class="card-neutral" x="1300" y="570" width="228" height="90" rx="12"/>
    <text class="card-title" x="1318" y="600">Qdrant adapter</text>
    <text class="card-copy" x="1318" y="623">Vector search storage</text>
    <text class="card-copy" x="1318" y="642">Dense embeddings</text>
  </g>
  <g>
    <rect class="card-neutral" x="1300" y="735" width="228" height="90" rx="12"/>
    <text class="card-title" x="1318" y="765">Metadata store</text>
    <text class="card-copy" x="1318" y="788">Video and segment records</text>
    <text class="card-copy" x="1318" y="807">SQL metadata persistence</text>
  </g>

  <rect x="48" y="960" width="1504" height="44" rx="12" fill="#eaf0f7"/>
  <text class="small" x="68" y="987">Arrows connect related helpers. Standalone cards show separate service or storage responsibilities.</text>
</svg>
