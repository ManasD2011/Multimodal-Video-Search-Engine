<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3EFE6" />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("vs-theme") || "system";
          const dark = preference === "dark" ||
            (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          const root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.themePref = ["system", "light", "dark"].includes(preference)
            ? preference
            : "system";
          root.style.colorScheme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#14110F" : "#F3EFE6");
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.themePref = "system";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <meta
      name="description"
      content="Search, organize, and review video evidence frame by frame."
    />
    <title>Vidsearch — Frame-first video search</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
